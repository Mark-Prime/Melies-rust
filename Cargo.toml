[package]
name = "melies_rust"
version = "0.1.0"
edition = "2024"
authors = ["Maven (famous)"]

[dependencies]
opener = { version = "0.7.2", features = ["reveal"] }
serde_json = "1.0"
chrono = "0.4.24"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
vdm = "1.0.9"
reqwest = { version = "0.11", features = ["blocking", "json"] }
steamid-ng = "1.0.0"
sysinfo = "0.32.1"
tf-demo-parser = { path = "../parser" }
human-sort = "0.2.2"
fnv = "1.0.7"
bitbuffer = { version = "0.11.0", features = ["serde"] }
num_enum = "0.5.7"
parse-display = "0.8.0"
sanitize-filename = "0.6.0"
trash = "3"
fs_extra = "1.3.0"